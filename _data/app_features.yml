features:
  - title: From your wrist
    text: Keep score on Apple Watch with one tap per point, without stopping to look for your phone.
  - title: Hear the score
    text: Scores and match points are announced out loud, so everyone on court stays up to date.
  - title: Tournaments
    text: Group your matches, follow the standings, and share a tournament so others can add their matches.
  - title: Rankings and history
    text: See who's on top and look back at every match you played.
  - title: Apple Health, if you like
    text: Save matches as workouts and get your statistics afterwards. It's entirely optional.
  - title: On all your devices
    text: iPhone, iPad and Apple Watch stay in step through iCloud, and a watch widget shows your game.

whats_new:
  - title: Now in five sports
    text: Badminton has company. Tennis, Padel, Squash and Table Tennis each have an app of their own.
  - title: Tournaments
    text: Run a tournament with its own roster and rankings, and share it so friends can add their matches.
  - title: Your own rules
    text: Change the points, the games and the scoring, separately for singles, doubles and one against two.
  - title: Sync with iCloud
    text: Your players and matches now follow you to all your devices, and your watch stays in step with your iPhone directly.
  - title: Follow live
    text: Watch the score of a match someone else is keeping, swiping between all games going on.
  - title: Start from your iPhone
    text: Set up a match on your iPhone and send it to your watch. A widget shows the game on your watch face.
